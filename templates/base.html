<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Iman Khafaga{% endblock %} - ImanKhafaga.Art</title>
    <link rel="stylesheet" href="https://use.typekit.net/tnm3wfk.css" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body class="{% if show_modal %}modal-open{% endif %}">
    <nav class="mobile-nav">
      <h2><a href="{{url_for('home')}}">Iman Khafaga</a></h2>
      <ul>
        <li>
          <a
            href="{{url_for('projects')}}"
            class="{% if active_page == 'projects' %}active{% endif %}"
            >Projects</a
          >
        </li>
        <li>
          <a
            href="{{url_for('sketchbook')}}"
            class="{% if active_page == 'sketchbook' %}active{% endif %}"
            >Sketchbook</a
          >
        </li>
        <li>
          <a
            href="{{url_for('links')}}"
            class="{% if active_page == 'links' %}active{% endif %}"
            >Links</a
          >
        </li>
        <li>
          <a
            href="{{url_for('contact')}}"
            class="{% if active_page == 'contact' %}active{% endif %}"
            >Contact</a
          >
        </li>
      </ul>
    </nav>

    <nav class="main-nav">
      <h1><a href="{{url_for('home')}}">Iman Khafaga</a></h1>
      <div class="nav-center"></div>
      <ul>
        <li>
          <a
            href="{{url_for('projects')}}"
            class="{% if active_page == 'projects' %}active{% endif %}"
            >Projects</a
          >
        </li>
        <li>
          <a
            href="{{url_for('sketchbook')}}"
            class="{% if active_page == 'sketchbook' %}active{% endif %}"
            >Sketchbook</a
          >
        </li>
        <li>
          <a
            href="{{url_for('links')}}"
            class="{% if active_page == 'links' %}active{% endif %}"
            >Links</a
          >
        </li>
        <li>
          <a
            href="{{url_for('contact')}}"
            class="{% if active_page == 'contact' %}active{% endif %}"
            >Contact</a
          >
        </li>
        <!-- <div class="nav-right">
          {% if session['user_id'] %}
          <li><a href="{{url_for('login')}}">Admin</a></li>
          {% else %}
          <li><a href="{{url_for('logout')}}">Logout</a></li>
          {% endif %}
        </div> -->
      </ul>
    </nav>

    <main>{% block content %}{% endblock %}</main>
  </body>
</html>
