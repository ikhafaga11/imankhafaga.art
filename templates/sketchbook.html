{% extends 'base.html' %}
{% block title %}Sketchbook{% endblock %}
{% block content %}
{% if session["user_id"] %}
<form method="post" autocomplete="off">
    <label for="image url">Image</label>
    <input name="image_url" id="image_url" autocomplete="off"/>
    <input type="submit" value="upload"/>
</form>
{% endif %}
<div class="sketches">
{% for sketch in sketches%}
<div class="sketch">
    <img src="{{sketch.image_url}}"/>
</div>
{% endfor %}
</div>

{% endblock %}
